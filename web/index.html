<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mini Three WASM</title>
</head>
<body>
<script type="module">
  import createModule from './engine.js';

  // Wait for WASM to finish loading
  createModule().then(Module => {
    // Pull the class from the Module object
    const Renderer = Module.Renderer;

    // Instantiate it safely
    const renderer = new Renderer(800, 600);
    renderer.clear(0.1, 0.1, 0.2);
  });
</script>

</body>
</html>
